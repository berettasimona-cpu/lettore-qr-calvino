<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lettore QR - Italo Calvino</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }
    button {
      padding: 16px;
      font-size: 18px;
      margin: 12px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }
    #messaggio {
      font-size: 19px;
      font-weight: bold;
      padding: 15px;
      margin: 15px;
      border-radius: 8px;
    }
    .verde {
      background: #d9f2df;
      color: #176b2c;
    }
    .rosso {
      background: #f8d7da;
      color: #a00000;
    }
  </style>
</head>
<body>

  <h2>Registro ingressi</h2>
  <p>Scuola dell'infanzia Italo Calvino</p>

  <button id="avvia" onclick="avviaFotocamera()">AVVIA FOTOCAMERA</button>

  <div id="reader"></div>
  <div id="messaggio">Premi il pulsante per iniziare.</div>

  <script>
    let scanner;
    let fotocamera;
    let inLettura = false;
    let inAttesa = false;

    const messaggio = document.getElementById("messaggio");

    function mostra(testo, colore) {
      messaggio.textContent = testo;
      messaggio.className = colore || "";
    }

    async function avviaFotocamera() {
      if (!window.opener) {
        mostra("Apri il lettore dalla pagina Registro ingressi.", "rosso");
        return;
      }

      try {
        if (!fotocamera) {
          const camere = await Html5Qrcode.getCameras();

          if (!camere || camere.length === 0) {
            throw new Error("Nessuna fotocamera trovata.");
          }

          const posteriore = camere.find(c =>
            /back|rear|environment|posteriore/i.test(c.label)
          );

          fotocamera = posteriore ? posteriore.id : camere[0].id;
          scanner = new Html5Qrcode("reader");
        }

        inLettura = true;
        inAttesa = false;

        await scanner.start(
          fotocamera,
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async (codice) => {
            if (inAttesa || !inLettura) return;

            inAttesa = true;
            inLettura = false;

            mostra("QR letto! Verifico l'ingresso...", "");

            try {
              await scanner.stop();
              window.opener.postMessage({
                type: "CALVINO_QR",
                token: codice
              }, "*");
            } catch (errore) {
              mostra("Errore nell'invio del codice.", "rosso");
            }
          }
        );

        mostra("Pronto! Inquadra il QR Code.", "");
      } catch (errore) {
        inLettura = false;
        mostra("Errore fotocamera: " + errore.message, "rosso");
      }
    }

    window.addEventListener("message", async function(event) {
      if (event.source !== window.opener) return;

      const dati = event.data;

      if (!dati || dati.type !== "CALVINO_RESULT") return;

      if (dati.ok) {
        mostra(dati.messaggio, "verde");
      } else {
        mostra(dati.messaggio, "rosso");
      }

      setTimeout(async function() {
        try {
          await avviaFotocamera();
        } catch (errore) {
          mostra("Tocca AVVIA FOTOCAMERA per riprendere.", "rosso");
        }
      }, 1800);
    });
  </script>

</body>
</html>
